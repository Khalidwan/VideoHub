{% extends "base.html" %}

{% block title %}
إنشاء حساب - JENBIR
{% endblock %}

{% block content %}

<div class="formbox">

    <h1>إنشاء حساب</h1>

    <form method="post">

        <input
            type="text"
            name="username"
            placeholder="اسم المستخدم"
            required>

        <input
            type="password"
            name="password"
            placeholder="كلمة المرور"
            required>

        <button type="submit">
            إنشاء الحساب
        </button>

    </form>

</div>

{% endblock %}

{% extends "base.html" %}

{% block title %}
تسجيل الدخول - VideoHub
{% endblock %}

{% block content %}

<div class="formbox">

    <h1>تسجيل الدخول</h1>

    <form method="post">

        <input
            type="text"
            name="username"
            placeholder="اسم المستخدم"
            required>

        <input
            type="password"
            name="password"
            placeholder="كلمة المرور"
            required>

        <button type="submit">
            دخول
        </button>

    </form>

</div>

{% endblock %}
